<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>.195</title>
    <meta name="application-name" content=".195" />
    <meta property="og:title" content=".195" />
    <meta name="twitter:title" content=".195" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Arvo:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      :root {
        /* Focal point sits below the viewport; radius reaches the top edge */
        --glow-center-below: 80vh;
        --glow-radius: calc(100vh + var(--glow-center-below));
        --glow-blur: 0vh;
      }

      body {
        background-color: #000128;
        font-family: "Arvo", serif;
        font-weight: 600;
      }

      .page {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .page::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          circle var(--glow-radius) at 50% calc(100% + var(--glow-center-below)),
          #ea8e5f 0%,
          #ea8e5f 40%,
          #a2638a 50%,
          #523a86 65%,
          #000128 100%
        );
        filter: blur(var(--glow-blur));
        pointer-events: none;
      }

      .title {
        position: relative;
        z-index: 1;
        color: #000128;
        font-weight: 400;
        font-synthesis: none;
        font-size: clamp(8rem, 44vw, 1280pt);
        line-height: 1;
        letter-spacing: -0.02em;
        white-space: nowrap;
        max-width: 100%;
        padding: 0 0.05em;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <h1 class="title">.195</h1>
    </main>
  </body>
</html>
